<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src file: data: blob:; media-src file: blob:; font-src file:; connect-src 'none'">
  <title>FPV Hangar</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- The window is dragged by its top edge, where a title bar would be. -->
  <div id="drag"></div>
  <!-- The tools down the left, on every page, with what is going on just now at their foot. -->
  <div id="side"></div>
  <div id="stage"></div>
  <div id="status"></div>
  <!-- The marker editor takes over the window beside the sidebar while a clip is open in it. -->
  <div id="editor"></div>
  <!-- So does the track in 3D. -->
  <div id="trackview"></div>
  <!-- And so does another project's own tool, shown inside the window. -->
  <div id="tool"></div>
  <div id="sheets"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
