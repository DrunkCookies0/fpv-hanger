# Publishes a release: packages the app for Mac and for Windows the same way package.sh does on a
# Mac, and attaches the two zips and latest.json, which is what copies of the app read to find a
# newer version.
#
# Each app tries itself out on its own kind of computer first: the Mac app as it is packaged, and
# then the Windows app, from its zip, on Windows. Nothing is published unless both pass.
#
# It starts in one of two ways:
# - A version tag (v0.13.0, say) pushed to GitHub, which is what publish.sh does.
# - By hand from the Actions page: Release, then Run workflow. Left as it is, that does everything
#   but publish, and the packages are kept with the run for a few days, to look at first. With
#   Publish ticked, on main, it publishes the version in VERSION once everything has passed, making
#   its tag itself, so a release needs no tag pushed from a computer. A run that fails publishes
#   nothing and leaves no tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in VERSION once everything has passed (from main only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Package, and try the Mac app
    runs-on: macos-latest
    # It takes about ten minutes. The app's own test is stopped after 25 by package.sh, so this is
    # only for something else that hangs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check it can be published
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::A release is published from main, and this run is on $GITHUB_REF_NAME."; exit 1; }
          grep -q "^## v$VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for v$VERSION."; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION has already been released. Put a new number in VERSION."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch what the app is built on
        working-directory: Hangar
        # Electron's own program isn't fetched by npm ci: it comes the first time it is asked for.
        run: |
          npm ci
          npx install-electron
          tools/fetch.sh

      - name: Test
        working-directory: Hangar
        run: npm test

      - name: Package
        shell: zsh {0}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$(< VERSION)" ]] || { echo "::error::The tag is $GITHUB_REF_NAME but VERSION says $(< VERSION)."; exit 1 }
          fi
          ./package.sh > package.log 2>&1 || {
            # Show the end of the log as the error, so it can be read without opening the run.
            # The whole of it is in the step's own log, for when the end isn't where it went wrong.
            cat package.log
            echo "::error::$(tail -n 60 package.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cat package.log

      # For the Windows run and the publishing below, and to look at first after a run made by hand.
      - name: Keep the packages with the run
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: Releases/
          retention-days: 5

  windows:
    name: Try the Windows app on Windows
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: Releases

      # Unzipped and opened as a pilot would, with no window, on a library and a recording it makes
      # for the purpose, as "Test this copy" does. It is a program with a window of its own, so it
      # is waited for.
      - name: Try itself out
        shell: pwsh
        run: |
          $zip = Get-ChildItem Releases -Filter "FPV-Hangar-v*-win64.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath app
          $exe = Get-ChildItem app -Recurse -Filter "FPV Hangar.exe" | Select-Object -First 1
          $report = Join-Path $PWD "self-test.txt"
          $run = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test", "--report", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Output "No report was written." }
          $passed = (Test-Path $report) -and (Select-String -Path $report -Pattern "^Everything passed\.$" -Quiet)
          if ($run.ExitCode -ne 0 -or -not $passed) {
            Write-Output "::error::The Windows app didn't pass its own test (it left with $($run.ExitCode)). Its report is above, and kept with the run."
            exit 1
          }

      # A program that stops before it can say why may have been written down by Windows.
      - name: What Windows noted going wrong
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-60) } -ErrorAction SilentlyContinue |
            Select-Object -First 15 | Format-List TimeCreated, ProviderName, Id, Message

      - name: Keep its report with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-self-test
          path: self-test.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish
    needs: [release, windows]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: Releases

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          # Run by hand, the tag doesn't exist yet: it is made here, on the commit that was packaged.
          gh release create "v$VERSION" "Releases/FPV-Hangar-v$VERSION-mac.zip" "Releases/FPV-Hangar-v$VERSION-win64.zip" Releases/latest.json \
            --target "$GITHUB_SHA" --title "FPV Hangar v$VERSION" --notes-file Releases/notes.md
